; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = standard

[env:esp32_ota]
extends = env:standard
upload_protocol = espota

[env:standard_w_gpio_uart]
extends = env:standard
build_flags =
    -DCONFIG_PRINT_MEASUREMENTS_UART_GPIO=1

[env:standard_no_wifi]
extends = env:standard
build_flags =
    -DCONFIG_DISABLE_WIFI=1
    -DCONFIG_PRINT_MEASUREMENTS_UART_GPIO=1

[env:standard]
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

framework = arduino
platform = https://github.com/platformio/platform-espressif32.git@8.0.0
board = esp32-c3-devkitm-1
upload_protocol = esptool
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_ESP32
    -DUSE_ESP32_FRAMEWORK_ARDUINO
    -DAUDIO_NO_SD_FS
    -DTEMPLATE_PLACEHOLDER=36
    -DCONFIG_PRINT_MEASUREMENTS_USB_CDC

extra_scripts =
    pre:minify_data.py
    pre:embed_data.py
    post:merge_firmware.py

lib_deps=
    ESP32Async/AsyncTCP @ 3.4.8
    ESP32Async/ESPAsyncWebServer @ 3.8.1
    tzapu/WiFiManager @ 2.0.17
